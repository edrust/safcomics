<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf9f4">

  <title>Ervin Rustemagić — In Memoriam</title>
  <meta name="description" content="In memoriam Ervin Rustemagić, 1952–2025.">
  <meta name="robots" content="index,follow">

  <meta property="og:title" content="Ervin Rustemagić — In Memoriam">
  <meta property="og:description" content="A memorial to Ervin Rustemagić.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/social-preview-v2.jpg">

  <link rel="icon" href="assets/favicon-v2.png">

  <style>
    :root {
      --paper: #fbf9f4;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      -webkit-text-size-adjust: 100%;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      background: var(--paper);
    }

    body {
      overflow-x: hidden;
    }

    main {
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: var(--paper);
    }

    .memorial-poster {
      display: block;
      width: 100%;
      max-width: 1055px;
      height: auto;
      margin: 0 auto;
      padding: 0;
      border: 0;
    }

    @media (min-width: 1100px) {
      body {
        padding: 24px 0;
      }

      .memorial-poster {
        box-shadow: 0 10px 40px rgba(0,0,0,.045);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .memorial-poster {
        width: 100vw;
        max-width: none;
      }
    }

    @media print {
      body {
        padding: 0;
      }

      .memorial-poster {
        width: 100%;
        max-width: none;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <img
      class="memorial-poster"
      src="assets/ervin-memorial-final-v2.png"
      width="1055"
      height="1491"
      alt="In memoriam Ervin Rustemagić, 1952–2025. His magic lasted until the very end — and for a man, that is no small thing. Miljenko Jergović. Forever loved by Edina, Maja, Edvin, Alem, Lejla, Benjamin, and Timur."
      decoding="async"
      fetchpriority="high"
    >
  </main>
</body>
</html>
