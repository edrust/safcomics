<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf9f4">
<title>Ervin Rustemagić — In Memoriam</title>
<meta name="description" content="In memoriam Ervin Rustemagić, 1952–2025.">

<style>
:root{
  --paper:#fbf9f4;
  --ink:#111111;
  --gold:#b1883d;
  --family:#111111;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--paper);
  color:var(--ink);
}

body{
  font-family:Didot,"Bodoni 72","Bodoni MT","Times New Roman",Georgia,serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

.page{
  width:min(100%,1055px);
  margin:0 auto;
  padding:24px 34px 36px;
  text-align:center;
  overflow:hidden;
}

.kicker{
  margin:0;
  font-size:14px;
  font-weight:400;
  letter-spacing:.42em;
  text-transform:uppercase;
}

.rule{
  width:50px;
  height:2px;
  margin:16px auto 22px;
  background:var(--gold);
}

h1{
  margin:0;
  font-size:clamp(50px,7.2vw,82px);
  line-height:.94;
  font-weight:400;
  letter-spacing:-.047em;
}

.dates{
  margin:12px 0 18px;
  font-size:24px;
  line-height:1;
  letter-spacing:.21em;
}

/* Only the second/original archival photograph is used.
   Edge treatment is intentionally VERY light: a narrow paper-colored veil,
   not a blur and not an AI edit. */
.hero-photo{
  position:relative;
  width:min(675px,81%);
  margin:0 auto 26px;
  overflow:hidden;
}

.hero-photo img{
  display:block;
  width:100%;
  height:auto;
  filter:grayscale(1) contrast(1.01);
}

.hero-photo::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      var(--paper) 0%,
      rgba(251,249,244,.30) 1.5%,
      transparent 4.5%,
      transparent 95.5%,
      rgba(251,249,244,.30) 98.5%,
      var(--paper) 100%),
    linear-gradient(180deg,
      var(--paper) 0%,
      rgba(251,249,244,.20) 1.5%,
      transparent 4%,
      transparent 96%,
      rgba(251,249,244,.20) 98.5%,
      var(--paper) 100%);
}

.quote{
  width:min(720px,78%);
  margin:0 auto 26px;
}

blockquote{
  max-width:100%;
  margin:0;
  padding:0;
  font-size:clamp(24px,3.15vw,36px);
  line-height:1.27;
  font-style:italic;
  font-weight:400;
  color:rgba(46,42,39,.88);
}

.qmark{
  display:inline-block;
  color:var(--gold);
  font-style:normal;
  font-weight:700;
  font-size:.92em;
  line-height:1;
  vertical-align:top;
}

.qopen{
  margin-right:.22em;
  transform:translateY(.02em);
}

.qclose{
  margin-left:.16em;
  transform:translateY(.06em);
}

.quote-line-two{
  white-space:nowrap;
}

.attribution{
  margin:18px 0 0;
  font-size:17px;
  line-height:1.2;
  font-style:italic;
}

.family-divider{
  width:50px;
  height:2px;
  margin:32px auto 18px;
  background:var(--gold);
}

.family{
  width:min(850px,96%);
  margin:0 auto;
  color:var(--family);
  font-size:23px;
  line-height:1.42;
}

.logo-divider{
  width:50px;
  height:2px;
  margin:26px auto 18px;
  background:var(--gold);
}

.saf{
  display:block;
  width:96px;
  height:auto;
  margin:0 auto;
  mix-blend-mode:multiply;
}

@media(max-width:700px){
  .page{
    padding:18px 14px 28px;
  }

  .kicker{
    font-size:11px;
  }

  .rule{
    margin:13px auto 17px;
  }

  h1{
    font-size:45px;
    line-height:.96;
  }

  .dates{
    font-size:20px;
    margin:8px 0 15px;
  }

  .hero-photo{
    width:86%;
    margin-bottom:22px;
  }

  blockquote{
    padding:0 31px;
    font-size:27px;
  }

  .quote-line-two{
    white-space:normal;
  }

  .attribution{
    font-size:18px;
  }

  .family-divider{
    margin-top:24px;
  }

  .family{
    font-size:15px;
  }

  .logo-divider{
    margin-top:19px;
  }

  .saf{
    width:90px;
  }
}

@media(min-width:1100px){
  body{padding:18px 0}
}
</style>
</head>

<body>
<main class="page">
  <p class="kicker">In Memoriam</p>
  <div class="rule" aria-hidden="true"></div>

  <h1>Ervin Rustemagić</h1>
  <p class="dates">1952 — 2025</p>

  <figure class="hero-photo">
    <img src="assets/ervin-archive-original.jpg"
         alt="Ervin Rustemagić at a comics gathering">
  </figure>

  <section class="quote">
    <blockquote><span class="qmark qopen">“</span>His magic lasted until the very end —<br><span class="quote-line-two">and for a man, that is no small thing.</span><span class="qmark qclose">”</span></blockquote>
    <p class="attribution">Miljenko Jergović</p>
  </section>

  <div class="family-divider" aria-hidden="true"></div>

  <p class="family">
    Forever loved by Edina, Maja, Edvin, Alem, Lejla, Benjamin, and Timur.
  </p>

  <div class="logo-divider" aria-hidden="true"></div>

  <img class="saf"
       src="assets/SAFlogo-original.jpg"
       alt="SAF — Strip Art Features">
</main>
</body>
</html>
