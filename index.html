<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf9f4">

<title>Ervin Rustemagić — In Memoriam</title>
<meta name="description" content="In memoriam Ervin Rustemagić, 1952–2025.">

<style>
:root{
  --paper:#fbf9f4;
  --ink:#11110f;
  --soft:#615c53;
  --gold:#ae8438;
  --rule:#d9cfbe;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--paper);
  color:var(--ink);
}

body{
  font-family:Didot,"Bodoni 72","Bodoni MT","Times New Roman",Georgia,serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

.memorial{
  width:min(100%,1055px);
  margin:0 auto;
  padding:28px 34px 40px;
  text-align:center;
  overflow:hidden;
}

.kicker{
  margin:0;
  font-size:15px;
  letter-spacing:.42em;
  text-transform:uppercase;
  font-weight:400;
}

.rule{
  display:block;
  width:52px;
  height:2px;
  margin:17px auto 22px;
  background:var(--gold);
}

h1{
  margin:0;
  font-weight:400;
  font-size:clamp(58px,9vw,104px);
  line-height:.93;
  letter-spacing:-.045em;
}

.dates{
  margin:12px 0 8px;
  font-size:28px;
  letter-spacing:.22em;
}

/* Real photo only. The fade is CSS, not image generation. */
.hero{
  position:relative;
  width:min(670px,94vw);
  height:575px;
  margin:0 auto 4px;
}

.hero::before{
  content:"";
  position:absolute;
  inset:2% 6% 7%;
  background:url("assets/ervin-portrait-real.jpg") 44% 46% / cover no-repeat;
  filter:blur(24px) grayscale(1);
  opacity:.08;
  transform:scale(1.03);
}

.hero img{
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  filter:grayscale(1);
  -webkit-mask-image:
    radial-gradient(ellipse 78% 80% at 49% 48%,
      #000 0 62%,
      rgba(0,0,0,.95) 69%,
      rgba(0,0,0,.65) 78%,
      rgba(0,0,0,.2) 88%,
      transparent 100%);
  mask-image:
    radial-gradient(ellipse 78% 80% at 49% 48%,
      #000 0 62%,
      rgba(0,0,0,.95) 69%,
      rgba(0,0,0,.65) 78%,
      rgba(0,0,0,.2) 88%,
      transparent 100%);
}

.quote{
  width:min(790px,95%);
  margin:0 auto 25px;
}

blockquote{
  position:relative;
  margin:0;
  padding:0 48px;
  font-size:clamp(31px,4.25vw,46px);
  line-height:1.28;
  font-style:italic;
  font-weight:400;
}

blockquote::before,
blockquote::after{
  position:absolute;
  color:var(--gold);
  font-style:normal;
  font-size:1.45em;
  line-height:1;
  font-weight:700;
}

blockquote::before{
  content:"“";
  left:0;
  top:-.04em;
}

blockquote::after{
  content:"”";
  right:0;
  bottom:-.12em;
}

.attribution{
  margin:18px 0 0;
  color:#26231f;
  font-size:18px;
  font-style:italic;
}

/* Exact archival photo source. */
.archive{
  position:relative;
  width:min(545px,82%);
  margin:12px auto 12px;
}

.archive img{
  display:block;
  width:100%;
  height:auto;
  filter:grayscale(1);
  -webkit-mask-image:
    radial-gradient(ellipse 86% 80% at 50% 50%,
      #000 0 66%,
      rgba(0,0,0,.8) 77%,
      rgba(0,0,0,.25) 90%,
      transparent 100%);
  mask-image:
    radial-gradient(ellipse 86% 80% at 50% 50%,
      #000 0 66%,
      rgba(0,0,0,.8) 77%,
      rgba(0,0,0,.25) 90%,
      transparent 100%);
}

.family-rule{
  display:block;
  width:52px;
  height:2px;
  margin:7px auto 14px;
  background:var(--gold);
}

.family{
  width:min(880px,96%);
  margin:0 auto;
  font-size:19px;
  line-height:1.45;
}

.logo-rule{
  display:block;
  width:52px;
  height:2px;
  margin:20px auto 15px;
  background:var(--gold);
}

/* Exact supplied SAF JPEG; multiply hides its white box without redrawing it. */
.saf-logo{
  display:block;
  width:132px;
  height:auto;
  margin:0 auto;
  mix-blend-mode:multiply;
}

@media (max-width:700px){
  .memorial{
    padding:20px 14px 28px;
  }

  .kicker{
    font-size:11px;
  }

  .rule{
    margin:13px auto 17px;
  }

  h1{
    font-size:56px;
    line-height:.96;
  }

  .dates{
    font-size:21px;
    margin-top:9px;
  }

  .hero{
    width:100%;
    height:440px;
    margin-top:2px;
  }

  .hero img{
    -webkit-mask-image:
      radial-gradient(ellipse 86% 82% at 49% 48%,
        #000 0 61%,
        rgba(0,0,0,.8) 76%,
        transparent 100%);
    mask-image:
      radial-gradient(ellipse 86% 82% at 49% 48%,
        #000 0 61%,
        rgba(0,0,0,.8) 76%,
        transparent 100%);
  }

  blockquote{
    padding:0 31px;
    font-size:29px;
  }

  .attribution{
    font-size:16px;
  }

  .archive{
    width:94%;
  }

  .family{
    font-size:16px;
  }

  .saf-logo{
    width:118px;
  }
}

@media (min-width:1100px){
  body{
    padding:20px 0;
  }
}
</style>
</head>

<body>
<main class="memorial">
  <p class="kicker">In Memoriam</p>
  <span class="rule" aria-hidden="true"></span>

  <h1>Ervin Rustemagić</h1>
  <p class="dates">1952 — 2025</p>

  <figure class="hero">
    <img
      src="assets/ervin-portrait-real.jpg"
      alt="Ervin Rustemagić smiling"
      width="445"
      height="567">
  </figure>

  <section class="quote">
    <blockquote>His magic lasted until the very end — and for a man, that is no small thing.</blockquote>
    <p class="attribution">Miljenko Jergović</p>
  </section>

  <figure class="archive">
    <img
      src="assets/ervin-archive-real.jpg"
      alt="Ervin Rustemagić at a comics gathering">
  </figure>

  <span class="family-rule" aria-hidden="true"></span>

  <p class="family">
    Forever loved by Edina, Maja, Edvin, Alem, Lejla, Benjamin, and Timur.
  </p>

  <span class="logo-rule" aria-hidden="true"></span>

  <img
    class="saf-logo"
    src="assets/SAFlogo-original.jpg"
    alt="SAF — Strip Art Features">
</main>
</body>
</html>
