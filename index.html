<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf9f4">
  <title>Ervin Rustemagić — In Memoriam</title>
  <meta name="description" content="In memoriam Ervin Rustemagić, 1952–2025.">
  <style>
    :root{
      --paper:#fbf9f4;
      --ink:#111;
      --gold:#b2883d;
      --text:#283556;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
    body{
      font-family:Didot,"Bodoni 72","Bodoni MT","Times New Roman",Georgia,serif;
      text-rendering:optimizeLegibility;
      -webkit-font-smoothing:antialiased;
    }
    .page{
      width:min(100%,1055px);
      margin:0 auto;
      padding:20px 26px 36px;
      text-align:center;
      overflow:hidden;
    }
    .kicker{
      margin:0;
      font-size:14px;
      letter-spacing:.42em;
      text-transform:uppercase;
      color:#222;
    }
    .rule{
      width:50px;
      height:2px;
      margin:16px auto 21px;
      background:var(--gold);
    }
    h1{
      margin:0;
      font-size:clamp(58px,8.8vw,102px);
      line-height:.94;
      font-weight:400;
      letter-spacing:-.048em;
    }
    .dates{
      margin:10px 0 6px;
      font-size:29px;
      letter-spacing:.22em;
    }
    .portrait-wrap{
      width:min(700px,95vw);
      margin:0 auto 10px;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:530px;
    }
    .portrait{
      width:min(620px,100%);
      height:auto;
      display:block;
      filter:drop-shadow(0 10px 24px rgba(0,0,0,.03));
    }
    .quote{
      width:min(820px,95%);
      margin:0 auto 22px;
    }
    blockquote{
      position:relative;
      margin:0;
      padding:0 52px;
      font-size:clamp(31px,4.2vw,46px);
      line-height:1.28;
      font-style:italic;
      font-weight:400;
    }
    blockquote::before,
    blockquote::after{
      position:absolute;
      color:var(--gold);
      font-style:normal;
      font-size:1.45em;
      line-height:1;
      font-weight:700;
    }
    blockquote::before{content:"“";left:2px;top:-.03em}
    blockquote::after{content:"”";right:2px;bottom:-.10em}
    .attribution{
      margin:16px 0 0;
      font-size:18px;
      font-style:italic;
      color:#28231d;
    }
    .archive-wrap{
      width:min(560px,84%);
      margin:6px auto 10px;
      display:flex;
      justify-content:center;
    }
    .archive{
      width:100%;
      height:auto;
      display:block;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.02));
    }
    .family-rule{
      width:50px;
      height:2px;
      margin:8px auto 14px;
      background:var(--gold);
    }
    .family{
      width:min(860px,96%);
      margin:0 auto;
      font-size:18px;
      line-height:1.45;
      color:var(--text);
    }
    .logo-rule{
      width:50px;
      height:2px;
      margin:18px auto 14px;
      background:var(--gold);
    }
    .logo{
      width:118px;
      height:auto;
      display:block;
      margin:0 auto;
    }
    @media (max-width:700px){
      .page{padding:16px 12px 28px}
      .kicker{font-size:11px}
      .rule{margin:13px auto 17px}
      h1{font-size:54px}
      .dates{font-size:21px}
      .portrait-wrap{min-height:auto;margin-bottom:10px}
      .portrait{width:min(500px,100%)}
      blockquote{font-size:29px;padding:0 32px}
      .attribution{font-size:16px}
      .archive-wrap{width:94%}
      .family{font-size:15px}
      .logo{width:108px}
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="kicker">In Memoriam</p>
    <div class="rule" aria-hidden="true"></div>

    <h1>Ervin Rustemagić</h1>
    <p class="dates">1952 — 2025</p>

    <div class="portrait-wrap">
      <img class="portrait" src="assets/ervin-portrait-soft.png" alt="Ervin Rustemagić smiling">
    </div>

    <section class="quote">
      <blockquote>His magic lasted until the very end — and for a man, that is no small thing.</blockquote>
      <p class="attribution">Miljenko Jergović</p>
    </section>

    <div class="archive-wrap">
      <img class="archive" src="assets/ervin-archive-soft.png" alt="Ervin Rustemagić at a comics gathering">
    </div>

    <div class="family-rule" aria-hidden="true"></div>
    <p class="family">Forever loved by Edina, Maja, Edvin, Alem, Lejla, Benjamin, and Timur.</p>

    <div class="logo-rule" aria-hidden="true"></div>
    <img class="logo" src="assets/SAFlogo-transparent.png" alt="SAF — Strip Art Features">
  </main>
</body>
</html>
